name: Feature request / 功能建议
description: Share an idea for the project / 提交你对项目的想法
title: "[Feature]: "
body:
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion / 功能建议
      description: Write your idea here. / 请直接写下你的想法。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 范围
      options:
        - Firmware or playback / 固件或播放
        - OLED UI / OLED 界面
        - SD or FatFs / SD 或 FatFs
        - OVID tools / OVID 工具
        - Build or VS Code / 构建或 VS Code
        - Documentation / 文档
    validations:
      required: true
