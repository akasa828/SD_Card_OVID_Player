[project]
name = "ovid-converter"
version = "1.3.0b2"
description = "Convert images, GIFs, image sequences, and videos to OVID v2"
requires-python = ">=3.10"
authors = [{ name = "riochihao" }]
dependencies = [
    "flet==0.86.5",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "flet-drop-zone",
]

[tool.uv.sources]
flet-drop-zone = { path = "tools/extensions/flet_drop_zone" }

[tool.flet]
org = "io.github.akasa828"
product = "OVID Converter"
company = "riochihao"
copyright = "Copyright (c) 2026 riochihao"
build_number = 2

[tool.flet.dev_packages]
flet-drop-zone = "tools/extensions/flet_drop_zone"

[tool.flet.app]
path = "tools"
module = "ovid_converter_gui"

[tool.flet.windows]
architecture = "x64"

[dependency-groups]
dev = [
    "flet-cli==0.86.5",
    "flet-desktop==0.86.5",
]
